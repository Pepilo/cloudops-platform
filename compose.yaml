services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: taskflow-api:1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: database
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    networks:
      - taskflow_network
    
  database:
    image: postgres:16
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - taskflow_network

volumes:
  postgresql_data:

networks:
  taskflow_network: